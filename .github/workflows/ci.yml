name: Dependency security and tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lambda/package-lock.json
      - run: npm ci --include=dev
      - run: npm ci --prefix lambda --omit=dev
      - run: npm run audit
      - run: npm test
      - run: npx --no-install cdk synth --no-lookups --quiet
