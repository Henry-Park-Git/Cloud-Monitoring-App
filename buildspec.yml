version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing the dependencies..."
      - npm ci --include=dev
      - npm ci --prefix lambda --omit=dev

  pre_build:
    commands:
      - npm run audit
      - echo "Running unit tests..."
      - npm run test
      - echo "Fetching urls from S3..."
      - node fetch-s3-data.js
  build:
    commands:
      - echo "Compiling the source..."
      - npx --no-install cdk synth WebCrawlerStack --json > WebCrawlerStack.json
  post_build:
    commands:
      - echo "Build completed"
artifacts:
  files:
    - WebCrawlerStack.json
