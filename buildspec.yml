version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm install
  pre_build:
    commands:
      - echo "Running pre-build steps..."
  build:
    commands:
      - echo "Compiling the source..."
      - npm run build
      - if [ $? -ne 0 ]; then echo "Build failed with errors"; exit 1; fi
  post_build:
    commands:
      - echo "Build completed"
      - if [ $? -ne 0 ]; then echo "Post-build step failed"; fi

artifacts:
  files:
    - '**/*'
  # Make sure this path actually exists in your build environment
  base-directory: 'build/output'

reports:
  # This should correspond to a real directory that contains test reports if you have any
  build-reports:
    files:
      - '**/*'
    # Adjust this if your project generates reports, otherwise, this can be omitted if not needed
    base-directory: 'build/reports'

on-failure: ABORT  # Ensures that the build stops if a phase fails