version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install -g aws-cdk  # Install AWS CDK CLI globally
      - npm install -g aws-sdk  # Ensure AWS SDK is globally available if needed
  pre_build:
    commands:
      - echo "Running pre-build steps..."
      - aws --version  # Output AWS CLI version for debugging
      - cdk --version  # Output CDK CLI version for debugging
  build:
    commands:
      - echo "Compiling the source..."
      - npm install
      - cdk bootstrap  # Initialize your CDK app in the AWS environment
      - cdk deploy --require-approval never  # Deploy without manual approvals
  post_build:
    commands:
      - echo "Build completed"