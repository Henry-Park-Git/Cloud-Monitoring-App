version: 0.2

phases:
  install:
    commands:
      - echo "Installing NVM and setting up Node.js environment"
      - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
      - . $HOME/.nvm/nvm.sh
      - nvm install 18
      - nvm use 18
      - node --version
      - npm install
  pre_build:
    commands:
      - echo "Pre-build steps..."
  build:
    commands:
      - npx cdk synth --output cdk.out
  post_build:
    commands:
      - echo "Post-build steps..."
